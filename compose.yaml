name: mini-social

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mini_social}
      POSTGRES_USER: ${POSTGRES_USER:-mini_social}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      backend:
        aliases: [mini-social-db]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      backend:
        aliases: [mini-social-redis]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      backend:
        aliases: [mini-social-minio]
      coolify: {}
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.mini-social-media.rule=(Host(`mini-social.online`) || Host(`www.mini-social.online`)) && PathPrefix(`/media/`)
      - traefik.http.routers.mini-social-media.entrypoints=https
      - traefik.http.routers.mini-social-media.tls=true
      - traefik.http.routers.mini-social-media.priority=100
      - traefik.http.routers.mini-social-media.middlewares=mini-social-media-strip
      - traefik.http.middlewares.mini-social-media-strip.stripprefix.prefixes=/media
      - traefik.http.services.mini-social-media.loadbalancer.server.port=9000

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/post-images
        mc mb --ignore-existing local/receipts
        mc anonymous set download local/post-images
        mc anonymous set none local/receipts
    networks: [backend]
    restart: "no"

  migrate:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${APP_URL:-https://mini-social.online}
        NEXT_PUBLIC_S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://mini-social.online/media}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_AUTH_ENABLED:-false}
        NEXT_PUBLIC_PASSWORD_RESET_ENABLED: ${NEXT_PUBLIC_PASSWORD_RESET_ENABLED:-false}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    image: mini-social-app:local
    command: ["node", "scripts/migrate.mjs"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mini_social}:${POSTGRES_PASSWORD}@mini-social-db:5432/${POSTGRES_DB:-mini_social}
    networks: [backend]
    restart: "no"

  postgrest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgresql://authenticator:postgrest@mini-social-db:5432/${POSTGRES_DB:-mini_social}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anonymous
      PGRST_JWT_SECRET: ${POSTGREST_JWT_SECRET:?POSTGREST_JWT_SECRET is required}
      PGRST_DB_POOL: 20
      PGRST_SERVER_PORT: 3000
    healthcheck:
      test: ["CMD", "postgrest", "--version"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      backend:
        aliases: [mini-social-postgrest]

  app:
    image: mini-social-app:local
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgrest:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mini_social}:${POSTGRES_PASSWORD}@mini-social-db:5432/${POSTGRES_DB:-mini_social}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      POSTGREST_URL: http://mini-social-postgrest:3000
      REDIS_URL: redis://mini-social-redis:6379
      S3_ENDPOINT: http://mini-social-minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://mini-social.online/media}
      NEXT_PUBLIC_S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://mini-social.online/media}
      OPENCLAW_INTERNAL_URL: ${OPENCLAW_INTERNAL_URL:-http://mini-social-openclaw:18789}
      OPENCLAW_URL: ${OPENCLAW_URL:-http://mini-social-openclaw:18789}
      MINISOCIAL_AGENT_INTERNAL_SECRET: ${MINISOCIAL_AGENT_INTERNAL_SECRET:-${OPENCLAW_GATEWAY_TOKEN:-}}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      AI_AGENT_BACKEND: ${AI_AGENT_BACKEND:-openclaw}
      AI_OPENCLAW_ENABLED: ${AI_OPENCLAW_ENABLED:-true}
      APP_URL: ${APP_URL:-https://mini-social.online}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://mini-social.online}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://mini-social.online}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-false}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-https://mini-social.online,https://www.mini-social.online}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
      NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_AUTH_ENABLED:-false}
      NEXT_PUBLIC_PASSWORD_RESET_ENABLED: ${NEXT_PUBLIC_PASSWORD_RESET_ENABLED:-false}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_BASIC: ${STRIPE_PRICE_BASIC:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
      STRIPE_PRICE_ID_5: ${STRIPE_PRICE_ID_5:-}
      STRIPE_PRICE_ID_10: ${STRIPE_PRICE_ID_10:-}
      STRIPE_PRICE_ID_20: ${STRIPE_PRICE_ID_20:-}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_EMAIL: ${VAPID_EMAIL:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OMNIROUTER_API_KEY: ${OMNIROUTER_API_KEY:-}
      OMNIROUTER_BASE_URL: ${OMNIROUTER_BASE_URL:-https://api.omniroute.ai/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      AI_PRIMARY_MODEL: ${AI_PRIMARY_MODEL:-}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-}
      AI_REASONING_MODEL: ${AI_REASONING_MODEL:-}
      AI_GEMMA_MODEL: ${AI_GEMMA_MODEL:-}
      PRICE_GEMINI_PER_1K: ${PRICE_GEMINI_PER_1K:-}
    ports:
      - 127.0.0.1:3100:3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      backend: {}
      coolify: {}
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.mini-social-http.rule=Host(`mini-social.online`) || Host(`www.mini-social.online`)
      - traefik.http.routers.mini-social-http.entrypoints=http
      - traefik.http.routers.mini-social-http.middlewares=mini-social-https-redirect
      - traefik.http.middlewares.mini-social-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.mini-social.rule=Host(`mini-social.online`) || Host(`www.mini-social.online`)
      - traefik.http.routers.mini-social.entrypoints=https
      - traefik.http.routers.mini-social.tls=true
      - traefik.http.routers.mini-social.tls.certresolver=letsencrypt
      - traefik.http.routers.mini-social.priority=10
      - traefik.http.routers.mini-social.middlewares=mini-social-security
      - traefik.http.middlewares.mini-social-security.headers.stsSeconds=31536000
      - traefik.http.middlewares.mini-social-security.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.mini-social-security.headers.contentTypeNosniff=true
      - traefik.http.middlewares.mini-social-security.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.services.mini-social.loadbalancer.server.port=3000

  mini-social-openclaw:
    container_name: mini-social-openclaw
    build:
      context: ./infra/openclaw
    image: mini-social-openclaw:local
    restart: unless-stopped
    expose:
      - "18789"
    environment:
      OPENCLAW_PORT: "18789"
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?OPENCLAW_GATEWAY_TOKEN is required}
      OPENCLAW_AI_BASE_URL: ${OPENCLAW_AI_BASE_URL:-${OMNIROUTER_BASE_URL:-https://api.omniroute.ai/v1}}
      OPENCLAW_AI_API_KEY: ${OPENCLAW_AI_API_KEY:-${OMNIROUTER_API_KEY}}
      OPENCLAW_PRIMARY_MODEL: ${OPENCLAW_PRIMARY_MODEL:-${AI_PRIMARY_MODEL:-nvidia/nemotron-3-ultra-550b-a55b:free}}
      OPENCLAW_FALLBACK_MODEL: ${OPENCLAW_FALLBACK_MODEL:-${AI_FALLBACK_MODEL:-google/gemini-3.5-flash-lite}}
      OPENCLAW_GEMMA_MODEL: ${OPENCLAW_GEMMA_MODEL:-${AI_GEMMA_MODEL:-google/gemma-4-31b-it:free}}
    volumes:
      - mini-social-openclaw-data:/app/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
          pids: 150
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      backend:
        aliases: [mini-social-openclaw]
      agent-egress: {}

  agent-cron:
    image: mini-social-app:local
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required}
    command:
      - node
      - -e
      - |
        const run = async () => {
          const response = await fetch('http://app:3000/api/agent/run', {
            headers: { authorization: 'Bearer ' + process.env.CRON_SECRET },
          })
          if (!response.ok) throw new Error('Agent cron returned HTTP ' + response.status)
          console.log(new Date().toISOString(), 'agent cron completed')
        }
        const next = new Date()
        next.setUTCHours(24, 0, 0, 0)
        setTimeout(async function tick() {
          try { await run() } catch (error) { console.error(error) }
          setTimeout(tick, 86400000)
        }, next.getTime() - Date.now())
    networks: [backend]

  backup:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: mini-social-db
      PGDATABASE: ${POSTGRES_DB:-mini_social}
      PGUSER: ${POSTGRES_USER:-mini_social}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?BACKUP_ENCRYPTION_KEY is required}
    volumes:
      - postgres_backups:/backups
    entrypoint:
      - /bin/bash
      - -ec
      - |
        while true; do
          backup_path="/backups/mini-social-$$(date -u +%Y%m%dT%H%M%SZ).dump.enc"
          pg_dump --format=custom |
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BACKUP_ENCRYPTION_KEY -out "$${backup_path}.tmp"
          mv "$${backup_path}.tmp" "$${backup_path}"
          find /backups -type f -name 'mini-social-*.dump.enc' -mtime +14 -delete
          sleep 86400
        done
    networks: [backend]

networks:
  backend:
    internal: true
  agent-egress:
    driver: bridge
  coolify:
    external: true

volumes:
  postgres_data:
  postgres_backups:
  redis_data:
  minio_data:
  mini-social-openclaw-data:
